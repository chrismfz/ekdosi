name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
        extensions: soap, intl, mbstring, zip, curl, bcmath, pdo_mysql, sqlite, pdo_sqlite
    - name: Validate composer files
      run: composer validate --strict
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Run Laravel tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test

  # SET-3 (AUDIT): the continuous-numbering guarantee (InvoiceNumberer's
  # lockForUpdate + transaction) can only be regression-tested against REAL
  # MariaDB row locks with forked processes — the PHPUnit suite runs on sqlite
  # and can't exercise it. Run the concurrency hammer here so a dropped
  # lockForUpdate() / transaction wrapper fails CI instead of silently shipping.
  numbering-concurrency:

    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: ekdosi_ci
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ekdosi_ci
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
        extensions: soap, intl, mbstring, zip, curl, bcmath, pdo_mysql, pcntl
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    # Since the v2.0.2 migration squash, `migrate` on an empty DB LOADS
    # database/schema/mariadb-schema.sql, and Laravel does that by shelling out
    # to the `mariadb` client binary (MariaDbSchemaState::load()) — the runner
    # image does not ship one, so it must be installed or migrate dies with
    # «sh: 1: mariadb: not found».
    - name: Install MariaDB client
      run: sudo apt-get update && sudo apt-get install -y mariadb-client
    # The MariaDB service is health-gated (healthcheck.sh) before any step runs,
    # so no manual wait loop is needed (one would only risk a false-RED).
    - name: Migrate (MariaDB)
      run: php artisan migrate --force
    - name: Concurrent invoice-numbering hammer (real row locks)
      run: php artisan test:invoice-numbering-concurrent --workers=24
